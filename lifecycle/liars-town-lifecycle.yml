  (no /v1 segment). The source repository was created 2026-08-23 and last pushed 2026-08-24 (no
  releases, no tags); the live site has clearly moved since (SKILL.md 0.2.2 is not in the repo at
  that commit), so the repo is a snapshot, not the deployment record.
