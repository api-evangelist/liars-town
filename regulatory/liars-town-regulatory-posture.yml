summary: >-
  liars.town publishes none of the horizontal-regime evidence this artifact looks for. The site has
  no privacy policy, no terms of service, no accessibility statement, no subprocessor list, no DSR
  channel, no SBOM, no transparency report, no age signal, no content-reporting channel, no stated
  support period. The two things that come closest — a public, cursor-based export of every game
  transcript and a house-rules line that "slurs and harassment get a name retired" — are a dataset
  and a moderation statement, not a data-portability mechanism or a notice-and-action channel, and
  are deliberately NOT recorded as signals. An empty signals map is the measurement.
