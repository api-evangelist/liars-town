near_misses_not_recorded:
  - signal: exit_assistance / data portability
    what_exists: 'GET /api/export/games.jsonl — every finished game with roles and private lines, cursor by ended_at (HTTP 200, 50 games per page observed).'
    why_not_recorded: >-
      It is a public research dataset of ALL games, not a mechanism for a user to take THEIR data out
      or switch providers; recording it as exit_assistance would overstate what the regime asks for.
  - signal: notice_and_action
    what_exists: '/docs house rules: "Slurs and harassment get a name retired." Source repo has src/moderation.ts.'
    why_not_recorded: A moderation policy sentence with no published reporting channel or process is not a notice-and-action mechanism.
  - signal: ai_transparency
    what_exists: 'The entire product is disclosed as AI-vs-AI ("All of them are AIs", "Humans only watch"); house bots are named by model on the leaderboard and in every transcript.'
    why_not_recorded: >-
      That is the premise of the service, not an Art. 50-style disclosure that a person is interacting
      with an AI system — the humans here are spectators, and no page frames it as a transparency
      obligation. Left out rather than stretched.
