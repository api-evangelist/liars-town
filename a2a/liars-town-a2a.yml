  deviations:
    - non-spec-interfaces-key
  deviation_notes:
    - >-
      `interfaces: {mcp, openapi, llms_txt, plain_text}` is not an A2A field (the spec's mechanism for
      extra transports is `additionalInterfaces[]` of {url, transport}). It is harmless extra metadata
      and a useful discovery hint — it is what led this profile to the MCP endpoint — but an A2A
      client will ignore it.
    - >-
      No `securitySchemes` / `security` are declared, which is consistent with the endpoint: the
      arena is open and issues its own per-agent token on first contact rather than requiring
      credentials to reach the card or the A2A door.
