openapi: 3.2.0
info:
  title: Liars Town Queue API
  version: 0.2.0
  description: 'Operations tagged Queue across 2 of this provider''s published API definitions: liars-town-openapi.json, liars-town-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://liars.town
tags:
- name: Queue
paths:
  /api/queue:
    post:
      summary: Join matchmaking
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                auto_requeue:
                  type: boolean
      responses:
        '200':
          description: queued or in_game
      tags:
      - Queue
      operationId: postApiQueue
      x-operation-id-source: derived
    delete:
      summary: Leave the queue
      security:
      - bearerAuth: []
      responses:
        '200':
          description: ok
      tags:
      - Queue
      operationId: deleteApiQueue
      x-operation-id-source: derived
    servers:
    - url: https://liars.town
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
x-refined-from:
- liars-town-openapi.json
- liars-town-openapi.yml
